# Build, test, code sign, and upload ZIP bundles for trusted releases.

name: Release Build

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    outputs:
      version_tag: ${{ steps.meta.outputs.version_tag }}
    permissions:
      actions: write # For actions/upload-artifact
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: 'recursive'

      - name: Build and test
        id: meta
        uses: ./.github/actions/build-and-test
        with:
          architectures: 'x86'
          release-tag-input: ${{ github.event.release.tag_name }}
          run-tests: 'true'

      - name: Upload unsigned build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unsigned-build-output
          path: |
            ${{ github.workspace }}/out/x86/Debug/
            ${{ github.workspace }}/out/x86/Release/
          if-no-files-found: error
          retention-days: 1

  sign-and-upload:
    needs: build-and-test
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    permissions:
      actions: read # For actions/download-artifact
      contents: write # For softprops/action-gh-release (uploading assets and updating release metadata)
      id-token: write # For .github/actions/azure-sign
    environment: release
    env:
      VERSION_TAG: ${{ needs.build-and-test.outputs.version_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive

      - name: Download unsigned build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: unsigned-build-output
          path: ${{ github.workspace }}/out/x86/

      - name: Azure login and sign build artifacts
        uses: ./.github/actions/azure-sign
        with:
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          signing-account-name: ${{ secrets.AZURE_SIGNING_ACCOUNT_NAME }}
          certificate-profile-name:
            ${{ secrets.AZURE_SIGNING_CERT_PROFILE_NAME }}

      - name: Collect artifacts and create ZIP bundles
        shell: pwsh
        env:
          ARCHITECTURES: 'x86'
        run: ./.github/scripts/collect-artifacts-and-zip.ps1

      - name: Upload ZIP to GitHub Release
        uses: softprops/action-gh-release@a06a81a03ee405af7f2048a818ed3f03bbf83c7b # v2
        with:
          files: |
            ${{ github.workspace }}/zip/DisplayProber-${{ env.VERSION_TAG }}-debug.zip
            ${{ github.workspace }}/zip/DisplayProber-${{ env.VERSION_TAG }}-release.zip
